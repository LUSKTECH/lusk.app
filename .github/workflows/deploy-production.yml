name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: Check Secrets
    runs-on: ubuntu-latest
    outputs:
      has-vercel: ${{ steps.vercel-check.outputs.defined }}
      has-netlify: ${{ steps.netlify-check.outputs.defined }}
      has-sentry: ${{ steps.sentry-check.outputs.defined }}
    steps:
      - name: Check VERCEL_TOKEN
        id: vercel-check
        shell: bash
        env:
          SECRET_VALUE: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "$SECRET_VALUE" != '' ]; then
            echo "defined=true" >> $GITHUB_OUTPUT
          else
            echo "defined=false" >> $GITHUB_OUTPUT
          fi

      - name: Check NETLIFY_AUTH_TOKEN
        id: netlify-check
        shell: bash
        env:
          SECRET_VALUE: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ "$SECRET_VALUE" != '' ]; then
            echo "defined=true" >> $GITHUB_OUTPUT
          else
            echo "defined=false" >> $GITHUB_OUTPUT
          fi

      - name: Check SENTRY_AUTH_TOKEN
        id: sentry-check
        shell: bash
        env:
          SECRET_VALUE: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ "$SECRET_VALUE" != '' ]; then
            echo "defined=true" >> $GITHUB_OUTPUT
          else
            echo "defined=false" >> $GITHUB_OUTPUT
          fi

  vercel-production:
    name: Vercel Production Deploy
    needs: [check-secrets]
    if: needs.check-secrets.outputs.has-vercel == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npx vitest --run

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          github-comment: false

  vercel-skip-notice:
    name: Vercel Skip Notice
    needs: [check-secrets]
    if: needs.check-secrets.outputs.has-vercel != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Vercel production deploy skipped — VERCEL_TOKEN secret is not configured."

  netlify-production:
    name: Netlify Production Deploy
    needs: [check-secrets]
    if: needs.check-secrets.outputs.has-netlify == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      - run: npx vitest --run

      - name: Deploy to Netlify (Production)
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./out
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Production deploy from ${{ github.sha }}'
          enable-pull-request-comment: false
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  netlify-skip-notice:
    name: Netlify Skip Notice
    needs: [check-secrets]
    if: needs.check-secrets.outputs.has-netlify != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Netlify production deploy skipped — NETLIFY_AUTH_TOKEN secret is not configured."

  sentry-release:
    name: Create Sentry Release
    needs: [check-secrets, vercel-production]
    if: always() && needs.check-secrets.outputs.has-sentry == 'true' && (needs.vercel-production.result == 'success' || needs.vercel-production.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Create Sentry Release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production

  sentry-skip-notice:
    name: Sentry Skip Notice
    needs: [check-secrets]
    if: needs.check-secrets.outputs.has-sentry != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Sentry release skipped — SENTRY_AUTH_TOKEN secret is not configured."
