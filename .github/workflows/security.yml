name: Security Scans

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: Check Secrets
    runs-on: ubuntu-latest
    outputs:
      has-snyk: ${{ steps.snyk-check.outputs.defined }}
      has-safety: ${{ steps.safety-check.outputs.defined }}
    steps:
      - name: Check SNYK_TOKEN
        id: snyk-check
        shell: bash
        env:
          SECRET_VALUE: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ "$SECRET_VALUE" != '' ]; then
            echo "defined=true" >> $GITHUB_OUTPUT
          else
            echo "defined=false" >> $GITHUB_OUTPUT
          fi

      - name: Check SAFETY_API_KEY
        id: safety-check
        shell: bash
        env:
          SECRET_VALUE: ${{ secrets.SAFETY_API_KEY }}
        run: |
          if [ "$SECRET_VALUE" != '' ]; then
            echo "defined=true" >> $GITHUB_OUTPUT
          else
            echo "defined=false" >> $GITHUB_OUTPUT
          fi

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.6

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6

  trivy:
    name: Trivy Scan
    if: ${{ vars.TRIVY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  trivy-skip-notice:
    name: Trivy Skip Notice
    if: ${{ vars.TRIVY_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Trivy scan skipped — TRIVY_ENABLED variable is not set to 'true'."

  snyk:
    name: Snyk Scan
    needs: [check-secrets]
    if: needs.check-secrets.outputs.has-snyk == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run Snyk test
        uses: snyk/actions/node@v1.0.0
        with:
          args: --severity-threshold=high

  snyk-skip-notice:
    name: Snyk Skip Notice
    needs: [check-secrets]
    if: needs.check-secrets.outputs.has-snyk != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Snyk scan skipped — SNYK_TOKEN secret is not configured."

  safety:
    name: Safety CLI Scan
    needs: [check-secrets]
    if: needs.check-secrets.outputs.has-safety == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install safety
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Safety check
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: safety check --key "$SAFETY_API_KEY" --output screen

  safety-skip-notice:
    name: Safety Skip Notice
    needs: [check-secrets]
    if: needs.check-secrets.outputs.has-safety != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Safety CLI scan skipped — SAFETY_API_KEY secret is not configured."

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
